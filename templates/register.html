<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Sign In - UnityBank</title>
<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --ink:#0B1B33;
    --ink-deep:#061224;
    --paper:#F5F6F8;
    --card:#FFFFFF;
    --accent:#0E7C86;
    --accent-dark:#0A5F67;
    --text-muted:#5B6472;
    --text-soft:#8A93A3;
    --line:#E2E5EA;
    --error:#B3261E;
    --error-bg:#FDECEA;

    --font-display: "Iowan Old Style", "Palatino Linotype", Georgia, ui-serif, serif;
    --font-body: "Segoe UI", ui-sans-serif, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif;
}

html, body{
    height:100%;
}

body{
    font-family:var(--font-body);
    background:var(--paper);
    color:var(--ink);
    display:flex;
    min-height:100vh;
    overflow-x:hidden;
}

.screen{
    display:flex;
    width:100%;
    min-height:100vh;
}

/* LEFT PANEL — brand / trust */
.brand-panel{
    position:relative;
    flex:0 0 44%;
    background:
        radial-gradient(circle at 15% 20%, rgba(14,124,134,0.25), transparent 45%),
        linear-gradient(165deg, var(--ink) 0%, var(--ink-deep) 100%);
    color:#EDEFF3;
    padding:56px 56px 40px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    overflow:hidden;
}

.brand-panel svg.lines{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    opacity:0.35;
}

.wordmark{
    position:relative;
    font-family:var(--font-display);
    font-size:26px;
    letter-spacing:0.01em;
}

.wordmark span{
    color:#5FC3CB;
}

.brand-copy{
    position:relative;
    max-width:360px;
}

.brand-copy h1{
    font-family:var(--font-display);
    font-weight:500;
    font-size:34px;
    line-height:1.25;
    margin-bottom:16px;
}

.brand-copy p{
    font-size:15px;
    line-height:1.6;
    color:#B7BECC;
    max-width:320px;
}

.trust-list{
    position:relative;
    list-style:none;
    margin-top:36px;
    display:flex;
    flex-direction:column;
    gap:14px;
}

.trust-list li{
    display:flex;
    align-items:flex-start;
    gap:10px;
    font-size:13px;
    color:#B7BECC;
}

.trust-list svg{
    flex:none;
    margin-top:2px;
}

.brand-foot{
    position:relative;
    font-size:12px;
    color:#7C8496;
}

/* RIGHT PANEL — form */
.form-panel{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 24px;
}

.card{
    width:100%;
    max-width:380px;
}

.card-header{
    margin-bottom:28px;
}

.card-eyebrow{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    color:var(--text-muted);
    margin-bottom:10px;
}

.card-header h2{
    font-size:22px;
    font-weight:600;
    color:var(--ink);
}

.error{
    background:var(--error-bg);
    color:var(--error);
    padding:12px 14px;
    border-radius:8px;
    margin-bottom:18px;
    font-size:13.5px;
    text-align:left;
    border:1px solid rgba(179,38,30,0.18);
}

/* FIELD — this wrapper + margin-bottom is what controls spacing between inputs */
.field{
    margin-bottom:18px;
    text-align:left;
}

.field label{
    display:block;
    font-size:13px;
    font-weight:600;
    color:var(--ink);
    margin-bottom:6px;
}

.input-row{
    position:relative;
}

.input{
    width:100%;
    padding:13px 14px;
    border-radius:8px;
    border:1px solid #CBD1DB;
    background:var(--card);
    color:var(--ink);
    outline:none;
    font-size:16px;
    font-family:var(--font-body);
    transition:border-color 0.15s, box-shadow 0.15s;
}

.input::placeholder{
    color:var(--text-soft);
}

.input-row .input{
    padding-right:64px;
}

.input:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(14,124,134,0.15);
}

.input.invalid{
    border-color:var(--error);
}

.input.invalid:focus{
    box-shadow:0 0 0 3px rgba(179,38,30,0.14);
}

.toggle-pw{
    position:absolute;
    right:4px;
    top:50%;
    transform:translateY(-50%);
    background:transparent;
    border:none;
    color:var(--accent-dark);
    font-size:13px;
    font-weight:600;
    padding:8px 10px;
    cursor:pointer;
    border-radius:6px;
    font-family:var(--font-body);
}

.toggle-pw:hover{
    background:rgba(14,124,134,0.08);
}

.toggle-pw:focus-visible,
.input:focus-visible,
.btn:focus-visible,
a:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
}

.field-error{
    color:var(--error);
    font-size:12.5px;
    margin-top:6px;
    display:none;
}

.field-error.visible{
    display:block;
}

/* "Remember this device" row — forgot-password link removed, so left-aligned now */
.field-row{
    display:flex;
    align-items:center;
    justify-content:flex-start;
    margin-bottom:22px;
}

.checkbox{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13.5px;
    color:var(--text-muted);
    cursor:pointer;
}

.checkbox input{
    width:16px;
    height:16px;
    accent-color:var(--accent);
    cursor:pointer;
}

.btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:8px;
    background:var(--accent);
    color:white;
    font-weight:600;
    cursor:pointer;
    font-size:15.5px;
    font-family:var(--font-body);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    transition:background 0.15s;
}

.btn:hover{
    background:var(--accent-dark);
}

.btn:disabled{
    opacity:0.75;
    cursor:not-allowed;
}

.spinner{
    width:16px;
    height:16px;
    border:2px solid rgba(255,255,255,0.4);
    border-top-color:white;
    border-radius:50%;
    animation:spin 0.7s linear infinite;
    display:none;
}

.btn.loading .spinner{
    display:inline-block;
}

@keyframes spin{
    to{ transform:rotate(360deg); }
}

.divider{
    display:flex;
    align-items:center;
    gap:12px;
    margin:26px 0;
    color:var(--text-soft);
    font-size:12.5px;
}

.divider::before,
.divider::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--line);
}

.register{
    text-align:center;
    font-size:14px;
    color:var(--text-muted);
}

.register a{
    color:var(--ink);
    text-decoration:none;
    font-weight:700;
}

.register a:hover{
    text-decoration:underline;
}

.card-foot{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    margin-top:28px;
    font-size:12px;
    color:var(--text-soft);
}

.sr-only{
    position:absolute;
    width:1px;
    height:1px;
    padding:0;
    margin:-1px;
    overflow:hidden;
    clip:rect(0,0,0,0);
    white-space:nowrap;
    border:0;
}

@media (prefers-reduced-motion: reduce){
    .spinner{
        animation:none;
    }
}

/* ============ RESPONSIVE ============ */
@media (max-width:900px){
    .screen{
        flex-direction:column;
    }

    .brand-panel{
        flex:none;
        padding:28px 24px;
    }

    .brand-copy h1{
        font-size:24px;
    }

    .brand-copy p{
        display:none;
    }

    .trust-list{
        flex-direction:row;
        flex-wrap:wrap;
        gap:18px;
        margin-top:18px;
    }

    .brand-foot{
        display:none;
    }

    .form-panel{
        padding:32px 20px 48px;
    }
}
</style>
</head>

<body>

<div class="card">

    <div class="logo">Unity<span>Bank</span></div>
    <div class="title">Create Your Account</div>

    <form method="POST">

        <input type="text" name="full_name" placeholder="Full Name" class="input" required>

        <input type="email" name="email" placeholder="Email Address" class="input" required>

        <input type="password" name="password" placeholder="Password" class="input" required>

        <button type="submit" class="btn">Open Account</button>

    </form>

    <div class="login">
        Already have an account?
        <a href="{{ url_for('login') }}">Login</a>
    </div>

</div>

</body>
</html>
